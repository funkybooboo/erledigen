<svg xmlns="http://www.w3.org/2000/svg" viewBox="108 96 320 320">
  <!-- Erledigen mark, light variant: pills in the light Fizzy palette and
       an ink (navy) spine on a transparent canvas - the surface behind
       the mark shows through, so in light mode the mark reads as sitting
       on white. Fills are presentation attributes, not embedded CSS:
       some browsers' favicon rasterizers do not run <style> blocks, and
       attribute fills render everywhere. Values are the light app.css
       theme tokens hardcoded to their sRGB values (a favicon renders
       outside the app and cannot use the live CSS variables). The
       hydrated app points the tab here when the resolved theme is light
       and at favicon-dark.svg when dark (+layout.svelte applyTheme). -->
  <rect x="108" y="108" width="296" height="76" rx="38" fill="#F3570A"/>
  <rect x="108" y="218" width="246" height="76" rx="38" fill="#F29100"/>
  <rect x="108" y="328" width="320" height="76" rx="38" fill="#398FFF"/>
  <rect x="108" y="108" width="76" height="296" rx="38" fill="#17233C"/>
</svg>