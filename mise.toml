[tools]
bun = "1.3.10"
lychee = "0.24.2"
gitleaks = "8.30.1"

[env]
# Server
PORT = "4000"
CORS_ORIGIN = "*"
NODE_ENV = "development"
RATE_LIMIT_RPM = "600"
# Client
VITE_API_URL = "http://localhost:4000"
VITE_PORT = "3000"

# -- Dev / prod servers (dockerized) ------------------------------------------
#
# The app itself runs in containers (compose.yaml); nothing here starts
# servers on the local filesystem anymore. Repo-management tasks (install,
# format, lint, type-check, build, clean, ci) further below still run locally
# against the working tree.
#
# NOTE: the dev stack publishes ports 3000/4000 -- stop any locally-running
# servers first or the port publish will fail. The prod stack
# (compose.prod.yaml) is independent: single port 8080 (PROD_PORT), so it
# can run alongside dev.

[tasks.dev]
description = "Start the docker dev stack (server + client, attached)"
run = "docker compose up"

[tasks.client]
description = "Start only the dev client container (attached)"
run = "docker compose up client"

[tasks.server]
description = "Start only the dev server container (attached)"
run = "docker compose up server"

[tasks.prod]
description = "Build and start the docker prod stack (detached)"
run = "docker compose -f compose.prod.yaml up -d --build"

[tasks.prod-stop]
description = "Stop the docker prod stack (data volume is kept)"
run = "docker compose -f compose.prod.yaml down"

[tasks.prod-logs]
description = "Follow the docker prod stack logs"
run = "docker compose -f compose.prod.yaml logs -f"

[tasks.dev-refresh]
description = "Rebuild dev images and recreate dev containers (run after changing dependencies)"
run = """
docker compose build server client
docker compose up -d --force-recreate --remove-orphans server client
"""

[tasks.storybook]
description = "Start Storybook (port 6006) -- local, not dockerized"
run = "bun run storybook"

# -- Dependencies --------------------------------------------------------------

[tasks.install]
description = "Install all dependencies"
run = "bun install"

[tasks.install-ci]
description = "Install all dependencies (frozen lockfile)"
run = "bun install --frozen-lockfile"

[tasks.install-playwright]
description = "Install Playwright browsers"
run = "bunx playwright install"

# -- Code quality --------------------------------------------------------------

[tasks.format]
description = "Format all files with Biome (auto-fix)"
run = "bun run format"

[tasks.lint]
description = "Lint all files with Biome (auto-fix)"
run = "bun run lint"

[tasks.biome-check]
description = "Check lint and format with Biome (no auto-fix, CI mode)"
run = "bun run check:ci"

[tasks.spellcheck]
description = "Spell-check the codebase with cspell"
run = "bun run spellcheck"

[tasks.check-links]
description = "Verify all markdown/source links resolve (lychee)"
run = "bun run check-links"

[tasks.scan-secrets]
description = "Scan for secrets in the working tree (gitleaks detect)"
run = "bun run scan-secrets"

[tasks.type-check]
description = "Type-check all packages"
run = "bun run type-check"

[tasks.svelte-check]
description = "Svelte diagnostics (a11y, unused CSS, runes misuse) -- fails on warnings"
run = "bun run check:svelte"

# -- Tests (dockerized: compose.test.yaml, no host volumes) -------------

[tasks.test]
description = "Run all unit tests in a container"
run = """
docker compose -f compose.test.yaml build unit
docker compose -f compose.test.yaml run --rm unit
"""

[tasks.test-e2e]
description = "Run Playwright e2e + api tests in the docker test stack"
run = """
docker compose -f compose.test.yaml build
docker compose -f compose.test.yaml up -d server-test client-test
docker compose -f compose.test.yaml run --rm e2e
status=$?
docker compose -f compose.test.yaml down
exit $status
"""

[tasks.test-api]
description = "Run Bruno API tests against the dockerized test server"
run = """
docker compose -f compose.test.yaml build
docker compose -f compose.test.yaml up -d server-test
docker compose -f compose.test.yaml run --rm api
docker compose -f compose.test.yaml down
"""

[tasks.test-all]
description = "Run Bruno API tests and Playwright e2e tests in the docker test stack"
run = """
docker compose -f compose.test.yaml build
docker compose -f compose.test.yaml up -d server-test client-test
docker compose -f compose.test.yaml run --rm api
docker compose -f compose.test.yaml run --rm e2e
status=$?
docker compose -f compose.test.yaml down
exit $status
"""

# -- Tests (local; quick feedback loops that only touch the repo) -------------

[tasks.test-watch]
description = "Run unit tests in watch mode -- local"
run = "bun run test:watch"

[tasks.test-coverage]
description = "Run unit tests with coverage -- local"
run = "bun run test:coverage"

# -- Clean ---------------------------------------------------------------------

[tasks.clean]
description = "Remove all build artifacts, caches, and node_modules"
run = """
find . -type d -name node_modules -prune -exec rm -rf {} +
find . -type d -name dist -prune -exec rm -rf {} +
find . -type d -name build -prune -exec rm -rf {} +
find . -type d -name .vite -prune -exec rm -rf {} +
find . -type d -name .biome-cache -prune -exec rm -rf {} +
find . -type d -name coverage -prune -exec rm -rf {} +
find . -name '*.tsbuildinfo' -delete
rm -rf storybook-static *storybook.log
rm -rf test-results/
"""

# -- Build ---------------------------------------------------------------------

[tasks.build]
description = "Build all packages (shared + server via bun build, client via vite)"
run = """
cd packages/shared && bun run build
cd ../server && bun run build
cd ../client && bun run build
"""

[tasks.build-storybook]
description = "Build Storybook"
dir = "packages/client"
run = "bun run build-storybook"

# -- CI ------------------------------------------------------------------------

[tasks.security]
description = "Run security audit"
run = "bun audit"

[tasks.ci]
description = "Run all CI checks (mirrors GitHub Actions ci.yml)"
depends = ["install-ci"]
run = """
mise run biome-check
mise run spellcheck
mise run check-links
mise run scan-secrets
mise run type-check
mise run test
mise run install-playwright
kill $(lsof -ti:3000,4000) 2>/dev/null || true
(cd packages/server && bun run start) &
SERVER_PID=$!
bunx wait-on http-get://localhost:4000/api/health --timeout 30000
(cd packages/client && bun run dev) &
CLIENT_PID=$!
bunx wait-on http-get://localhost:3000 --timeout 30000
mise run test-e2e
mise run test-api
kill $SERVER_PID $CLIENT_PID 2>/dev/null || true
mise run build
CLIENT_SIZE=$(du -sb packages/client/dist 2>/dev/null | cut -f1 || echo "0")
MAX_SIZE=524288
echo "Client bundle size: $CLIENT_SIZE bytes"
if [ $CLIENT_SIZE -gt $MAX_SIZE ]; then
  echo "Client bundle exceeds $MAX_SIZE bytes (512KB)"
  exit 1
fi
echo "Client bundle size OK"
mise run build-storybook
mise run security || echo "warning: security vulnerabilities found - review required"
"""
