[tools]
bun = "1.3.10"
lychee = "0.24.2"
gitleaks = "8.30.1"

[env]
# Server
PORT = "4000"
CORS_ORIGIN = "*"
NODE_ENV = "development"
RATE_LIMIT_RPM = "600"
# Client
VITE_API_URL = "http://localhost:4000"
VITE_PORT = "3000"

# -- How this file is organized -----------------------------------------------
#
# mise is the task REGISTRY; the tools/ scripts hold the LOGIC. Anything
# longer than a plain one-liner (test-stack orchestration, build + bundle
# budget, version bumps, releases, cleaning, the local CI mirror) lives in
# tools/*.sh and the tasks below just delegate to it. Pass task arguments
# through with `mise run <task> -- <args>` (e.g. `mise run update-version --
# patch`).
#
# The app itself runs in containers (compose.yaml); nothing here starts
# servers on the local filesystem anymore.
#
# NOTE: the dev stack publishes ports 3000/4000 -- stop any locally-running
# servers first or the port publish will fail. The prod stack
# (compose.prod.yaml) is independent: single port 8080 (PROD_PORT), so it
# can run alongside dev.

# -- Dev / prod servers (dockerized) ------------------------------------------

[tasks.dev]
description = "Start the docker dev stack (server + client, attached)"
run = "docker compose up"

[tasks.prod]
description = "Build and start the docker prod stack (detached)"
run = "docker compose -f compose.prod.yaml up -d --build"

[tasks.prod-stop]
description = "Stop the docker prod stack (data volume is kept)"
run = "docker compose -f compose.prod.yaml down"

[tasks.prod-logs]
description = "Follow the docker prod stack logs"
run = "docker compose -f compose.prod.yaml logs -f"

[tasks.dev-refresh]
description = "Rebuild dev images and recreate dev containers (run after changing dependencies)"
run = """
tools/build-images.sh dev
docker compose up -d --force-recreate --remove-orphans server client
"""

[tasks.nuke-db]
description = "PERMANENTLY delete the dev or prod DB volume (stops the stack first): dev | prod (tools/nuke-db.sh)"
run = "tools/nuke-db.sh"

[tasks.storybook]
description = "Start Storybook (port 6006) -- local, not dockerized"
run = "bun run storybook"

# -- Dependencies --------------------------------------------------------------

[tasks.install]
description = "Install all dependencies"
run = "bun install"

[tasks.install-ci]
description = "Install all dependencies (frozen lockfile)"
run = "bun install --frozen-lockfile"

[tasks.install-playwright]
description = "Install Playwright browsers"
run = "bunx playwright install"

# -- Code quality (local, one-line wrappers over package.json scripts) --------

[tasks.format]
description = "Format all files with Biome (auto-fix)"
run = "bun run format"

[tasks.lint]
description = "Lint all files with Biome (auto-fix)"
run = "bun run lint"

[tasks.biome-check]
description = "Check lint and format with Biome (no auto-fix, CI mode)"
run = "bun run check:ci"

[tasks.spellcheck]
description = "Spell-check the codebase with cspell"
run = "bun run spellcheck"

[tasks.check-links]
description = "Verify all markdown/source links resolve (lychee)"
run = "bun run check-links"

[tasks.scan-secrets]
description = "Scan for secrets in the working tree (gitleaks detect)"
run = "bun run scan-secrets"

[tasks.type-check]
description = "Type-check all packages"
run = "bun run type-check"

[tasks.svelte-check]
description = "Svelte diagnostics (a11y, unused CSS, runes misuse) -- fails on warnings"
run = "bun run check:svelte"

# -- Tests (dockerized: compose.test.yaml, no host volumes) -------------

[tasks.test]
description = "Run all unit tests in a container"
run = "tools/test-stack.sh unit"

[tasks.test-e2e]
description = "Run Playwright e2e + api tests in the docker test stack"
run = "tools/test-stack.sh e2e"

[tasks.test-api]
description = "Run Bruno API tests against the dockerized test server"
run = "tools/test-stack.sh api"

[tasks.test-all]
description = "Run Bruno API tests and Playwright e2e tests in the docker test stack"
run = "tools/test-stack.sh all"

# -- Tests (local; quick feedback loops that only touch the repo) -------------

[tasks.test-watch]
description = "Run unit tests in watch mode -- local"
run = "bun run test:watch"

[tasks.test-coverage]
description = "Run unit tests with coverage -- local"
run = "bun run test:coverage"

# -- Clean ---------------------------------------------------------------------

[tasks.clean]
description = "Remove all build artifacts, caches, and node_modules (tools/clean-repo.sh)"
run = "tools/clean-repo.sh"

# -- Build ---------------------------------------------------------------------
# Two different builds: `build` compiles the app packages locally;
# `build-images` builds the docker images. The compose stacks also build
# their images on demand, so build-images is for pre-warming or verifying.

[tasks.build]
description = "Build the app packages locally (shared/server via bun build, client via vite) + bundle-size budget"
run = "tools/build.sh"

[tasks.build-images]
description = "Build docker images for a stack: dev | test | prod | all (tools/build-images.sh)"
run = "tools/build-images.sh"

[tasks.build-storybook]
description = "Build Storybook"
dir = "packages/client"
run = "bun run build-storybook"

# -- Release -------------------------------------------------------------------

[tasks.update-version]
description = "Bump the version everywhere: major | minor | patch | X.Y.Z (tools/update-version.sh)"
run = "tools/update-version.sh"

[tasks.release]
description = "Cut a release: gates + version bump + commit + tag. Args: [--full] [--push] <bump> (tools/release.sh)"
run = "tools/release.sh"

# -- Maintenance ----------------------------------------------------------------

[tasks.doctor]
description = "Pre-flight environment check: tools, version sync, docker, ports, repo state (tools/doctor.sh)"
run = "tools/doctor.sh"

[tasks.update-deps]
description = "Update dependencies the safe way. Args: [--fresh] [--yes] [--no-gates] [-n] (tools/update-deps.sh)"
run = "tools/update-deps.sh"

[tasks.changelog]
description = "Generate release notes from the commit log. Args: [--write] [<from> [<to>]] (tools/changelog.sh)"
run = "tools/changelog.sh"

# -- CI ------------------------------------------------------------------------

[tasks.security]
description = "Run security audit"
run = "bun audit"

[tasks.ci]
description = "Run all CI checks locally (mirrors GitHub Actions ci.yml; fully dockerized tests)"
run = "tools/ci.sh"

