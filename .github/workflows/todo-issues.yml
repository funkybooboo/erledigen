name: Marker issues

# Turns new code-marker comments (the action's defaults) found in pushed
# commits into GitHub issues. Runs only on pushes to main (PR merges
# included) so branch churn does not spawn issues that get closed a few
# commits later. Issues close automatically when their marker comment is
# removed. The workflow's own directory is excluded so this file can never
# match itself.

on:
  push:
    branches: [main]

permissions:
  contents: read
  issues: write

jobs:
  todo:
    name: marker-to-issue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Turn marker comments into issues
        uses: alstr/todo-to-issue-action@v5.1.13
        with:
          exclude: '^\.github/.*'