name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main]

permissions:
    contents: read
    pull-requests: write

jobs:
    quality-checks:
        name: Quality Checks
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Install dependencies
              run: mise run install-ci

            - name: Check code quality (lint + format)
              run: mise run biome-check

            - name: Spell check
              run: mise run spellcheck

            - name: Verify links
              run: mise run check-links

            - name: Scan for secrets
              run: mise run scan-secrets

            - name: Type check
              run: mise run type-check

            - name: Svelte check (fails on warnings)
              run: mise run svelte-check

    unit-tests:
        name: Unit Tests
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Install dependencies
              run: mise run install-ci

            - name: Run unit tests
              run: mise run test

    e2e-tests:
        name: E2E Tests
        runs-on: ubuntu-latest
        # mise run test-e2e builds the compose.test.yaml images from scratch
        # on a fresh runner (playwright base image + bun install layers)
        # before running the suite.
        timeout-minutes: 40

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Install dependencies
              run: mise run install-ci

            # test-e2e builds and boots the whole compose.test.yaml stack
            # (server-test + client-test + the playwright runner) with no
            # host ports -- no manual server/client bootstrap (or local
            # browser install) is needed or useful. The previous Start/Wait
            # steps were vestigial from the pre-docker layout: they ran a
            # SECOND dev stack in the background and timed out waiting for
            # its image build. The stack mounts nothing, so there is no
            # playwright-report/ on the host to upload; the exit code is
            # the only artifact.
            - name: Run E2E tests
              run: mise run test-e2e

    api-tests:
        name: API Tests
        runs-on: ubuntu-latest
        # test-api builds compose.test.yaml's server-test image from
        # scratch on a fresh runner before the Bruno suite runs.
        timeout-minutes: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Install dependencies
              run: mise run install-ci

            # test-api builds and boots the dockerized server-test stack and
            # runs the Bruno collection against it in-network. The previous
            # Start/Wait steps were vestigial from the pre-docker layout and
            # timed out waiting for a background dev-stack image build.
            - name: Run API tests
              run: mise run test-api

    build:
        name: Build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Install dependencies
              run: mise run install-ci

            - name: Build all packages (+ bundle-size budget)
              # tools/build.sh builds shared/server/client and fails if the
              # browser payload in packages/client/build/client exceeds
              # 512 KiB (MAX_CLIENT_BYTES to override).
              run: mise run build

    storybook-build:
        name: Storybook Build
        runs-on: ubuntu-latest
        timeout-minutes: 10

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Install dependencies
              run: mise run install-ci

            - name: Build Storybook
              run: mise run build-storybook

    security:
        name: Security Audit
        runs-on: ubuntu-latest
        timeout-minutes: 5
        continue-on-error: true

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Install mise
              uses: jdx/mise-action@v2

            - name: Security audit
              run: mise run security

    all-checks:
        name: All Checks Passed
        runs-on: ubuntu-latest
        needs: [quality-checks, unit-tests, e2e-tests, api-tests, build, storybook-build]
        if: always()

        steps:
            - name: Check all jobs
              if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
              run: exit 1
