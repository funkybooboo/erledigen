{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
    name: {{ include "erledigen.fullname" . }}
    labels:
        {{- include "erledigen.labels" . | nindent 8 }}
spec:
    ingressClassName: {{ .Values.ingress.className }}
    {{- if .Values.ingress.tls }}
    tls:
        - hosts:
              - {{ .Values.ingress.host | quote }}
    {{- end }}
    rules:
        - host: {{ .Values.ingress.host | quote }}
          http:
              paths:
                  # The same split the compose proxy does: API + WebSocket
                  # to the server, everything else to the client. Paths
                  # pass through unchanged (no rewrite).
                  - path: /api
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "erledigen.fullname" . }}-server
                            port:
                                number: {{ .Values.server.port }}
                  - path: /ws
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "erledigen.fullname" . }}-server
                            port:
                                number: {{ .Values.server.port }}
                  - path: /
                    pathType: Prefix
                    backend:
                        service:
                            name: {{ include "erledigen.fullname" . }}-client
                            port:
                                number: {{ .Values.client.port }}
{{- end }}