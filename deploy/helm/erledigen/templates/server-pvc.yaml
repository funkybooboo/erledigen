{{- if .Values.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: {{ include "erledigen.fullname" . }}-data
    labels:
        {{- include "erledigen.labels" . | nindent 8 }}
spec:
    accessModes:
        # Single-replica by design (ADR-018): the SQLite file is never
        # mounted by two writers.
        - ReadWriteOnce
    {{- with .Values.persistence.storageClassName }}
    storageClassName: {{ . | quote }}
    {{- end }}
    resources:
        requests:
            storage: {{ .Values.persistence.size }}
{{- end }}