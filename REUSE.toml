# REUSE.toml -- https://reuse.software
# One declaration instead of per-file SPDX headers. Verified with
# `reuse lint` (https://github.com/fsfe/reuse-tool); the license text
# lives in LICENSE.

version = 1

[[annotations]]
path = [
    "*.md",
    "*.json",
    "*.ts",
    "*.svelte",
    "*.js",
    "*.css",
    "*.sh",
    "*.sql",
    "*.yaml",
    "*.yml",
    "*.toml",
    "Dockerfile",
    ".dockerignore",
    ".gitignore",
    ".editorconfig",
    "LICENSE",
    "docs/**",
    "packages/**",
    "tests/**",
    "tools/**",
    "deploy/**",
    ".github/**",
    ".husky/*",
    ".gitleaks.toml",
    "lychee.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 funkybooboo"
SPDX-License-Identifier = "AGPL-3.0-only"