# REUSE.toml -- https://reuse.software
# One declaration instead of per-file SPDX headers. Verified with
# `reuse lint` (https://github.com/fsfe/reuse-tool); the license text
# lives in LICENSE.

version = 1

# Vendored Swagger UI dist output (Apache-2.0, from the npm package
# swagger-ui-dist; provenance in packages/server/src/docs/assets/README.md).
# Our own init.js and README.md in that directory are project files and
# stay under the general annotation below.
[[annotations]]
path = [
    "packages/server/src/docs/assets/swagger-ui-bundle.js",
    "packages/server/src/docs/assets/swagger-ui-bundle.js.LICENSE.txt",
    "packages/server/src/docs/assets/swagger-ui.css",
]
precedence = "closest"
SPDX-FileCopyrightText = "2020-2021 SmartBear Software Inc."
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
    "*.md",
    "*.json",
    "*.ts",
    "*.svelte",
    "*.js",
    "*.css",
    "*.sh",
    "*.sql",
    "*.yaml",
    "*.yml",
    "*.toml",
    "Dockerfile",
    ".dockerignore",
    ".gitignore",
    ".editorconfig",
    "LICENSE",
    "docs/**",
    "packages/**",
    "tests/**",
    "tools/**",
    "deploy/**",
    ".github/**",
    ".husky/*",
    ".gitleaks.toml",
    "lychee.toml",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "2026 funkybooboo"
SPDX-License-Identifier = "AGPL-3.0-only"